[package]
name = "herdr-infinity"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Native Herdr integration for the Infinity Code agent runtime"
repository = "https://github.com/yijunyu/herdr-infinity"
homepage = "https://github.com/yijunyu/herdr-infinity"
readme = "README.md"
keywords = ["herdr", "infinity", "agents", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
